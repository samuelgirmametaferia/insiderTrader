[package]
name = "insidertrader-desktop"
version = "0.1.0"
description = "InsiderTrader Tauri desktop shell"
authors = ["InsiderTrader"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "insidertrader_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
insider-common-types = { path = "../../crates/common-types" }
insider-engine = { path = "../../crates/engine" }
insider-replay = { path = "../../crates/replay" }
insider-execution = { path = "../../crates/execution" }
insider-ipc = { path = "../../crates/ipc" }
insider-llm-core = { path = "../../crates/llm-core" }
insider-metric-sdk = { path = "../../crates/metric-sdk" }
insider-experiment-registry = { path = "../../crates/experiment-registry" }
insider-model-registry = { path = "../../crates/model-registry" }
insider-risk-engine = { path = "../../crates/risk-engine" }

[features]
custom-protocol = ["tauri/custom-protocol"]

# The desktop shell is built as a separate Tauri workspace. Domain crates are
# consumed through explicit path dependencies so the root headless workspace
# remains independently buildable.
[workspace]

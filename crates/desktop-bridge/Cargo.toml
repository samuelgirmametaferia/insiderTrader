[package]
name = "insider-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "insider_runtime"

[[bin]]
name = "insider-runtime"
path = "src/main.rs"

[dependencies]
insider-broker-api = { path = "../broker-api" }
insider-cfg-core = { path = "../cfg-core" }
insider-common-types = { path = "../common-types" }
insider-engine = { path = "../engine" }
insider-metric-host = { path = "../metric-host" }
insider-metric-sdk = { path = "../metric-sdk" }
insider-exchange-sim = { path = "../exchange-sim" }
insider-instrument-master = { path = "../instrument-master" }
insider-ibkr-adapter = { path = "../ibkr-adapter" }
insider-ipc = { path = "../ipc" }
insider-market-types = { path = "../market-types" }
insider-market-data = { path = "../market-data" }
insider-market-providers = { path = "../market-providers" }
insider-portfolio = { path = "../portfolio" }
insider-risk-engine = { path = "../risk-engine" }
insider-news-core = { path = "../news-core" }
insider-news-providers = { path = "../news-providers" }
insider-strategy-host = { path = "../strategy-host" }
insider-strategy-sdk = { path = "../strategy-sdk" }
insider-llm-core = { path = "../llm-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

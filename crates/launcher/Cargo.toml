[package]
name = "insider-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "insider"
path = "src/main.rs"

[dependencies]
insider-cfg-core = { path = "../cfg-core" }
insider-engine = { path = "../engine" }
insider-ipc = { path = "../ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

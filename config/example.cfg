# Copy to a deployment-owned path and pass it with:
# insider-runtime serve --config PATH --journal PATH --socket PATH
#
# Secrets are intentionally excluded. Use the deployment secret manager for
# provider API keys and inject only the documented secret references.

risk.max_leverage = 2.0
risk.max_position_ticks = 1000000
risk.max_gross_notional_ticks = 100000000000
risk.max_drawdown_bps = 500
risk.max_outstanding_orders = 32
risk.max_predicted_volatility_bps = 250
risk.max_participation_bps = 1000
risk.max_message_rate = 20
risk.max_price_deviation_bps = 75

# Operational cadence and transport settings (all bounded by the engine).
scheduler.python_cycle_ms = 100
scheduler.execution_cycle_ms = 25
market.max_age_ms = 60000
# IBKR connectivity and quote polling (used only when broker mode is ibkr).
broker.mode = "paper"
# Required for broker.mode = "ibkr"; credentials remain in the secret manager.
# broker.ibkr_account_id = "DU123456"
# broker.ibkr_conid = "265598"
# broker.ibkr_instrument_id = "1"
broker.ibkr_base_url = "https://127.0.0.1:5000"
broker.ibkr_timeout_ms = 10000
broker.ibkr_market_poll_ms = 1000
broker.ibkr_price_scale = 10000
# Synthetic bootstrap marks remain disabled unless explicitly approved.
# broker.allow_ibkr_bootstrap_mark = false
strategy.reference_enabled = false
strategy.reference_id = "microstructure.imbalance.threshold.v1"
strategy.reference_metric_id = "microstructure.imbalance.v1"
strategy.reference_entry_threshold = 0.5
strategy.reference_exit_threshold = 0.1
strategy.reference_quantity_ticks = 1
strategy.reference_horizon_ns = 900000000000
strategy.reference_ttl_ns = 5000000000
# Conservative deterministic starter strategy. It emits typed proposals only;
# order submission still requires the configured manual/hybrid/autonomy path.
strategy.starter_enabled = false
strategy.starter_id = "cross_asset.volatility_scaled_trend.v1"
strategy.starter_trend_metric_id = "trend.ema.normalized.v1"
strategy.starter_volatility_metric_id = "volatility.atr.normalized.v1"
strategy.starter_spread_metric_id = "liquidity.spread.v1"
strategy.starter_entry_threshold = 0.002
strategy.starter_exit_threshold = 0.0005
strategy.starter_max_spread = 0.0025
strategy.starter_target_volatility = 0.015
strategy.starter_min_confidence = 0.65
strategy.starter_quantity_ticks = 10
strategy.starter_horizon_ns = 900000000000
strategy.starter_ttl_ns = 5000000000
# Reference metric definitions.
metric.ewma_id = "volatility.ewma.v1"
metric.ewma_lambda = 0.94
metric.ewma_ttl_ns = 5000000000
metric.reference_ttl_ns = 5000000000
metric.sma_id = "trend.sma.v1"
metric.sma_window = 20
metric.spread_id = "liquidity.spread.v1"
metric.imbalance_id = "microstructure.imbalance.v1"
metric.trend_id = "trend.ema.normalized.v1"
metric.trend_fast_window = 8
metric.trend_slow_window = 21
metric.atr_id = "volatility.atr.normalized.v1"
metric.atr_window = 14
# Optional Yahoo research/chart adapter tuning (bounded by the bridge).
market.http_timeout_ms = 30000
market.yahoo_interval_ns = 60000000000
market.yahoo_price_scale = 10000
market.yahoo_poll_ms = 60000
market.yahoo_quote_poll_ms = 5000
# Safety override defaults false and requires explicit operator policy.
# market.allow_yahoo_live_marks = false
# Bounded quote subscription used by the paper setup. Replace the provider URL
# and symbol mapping in the CFG GUI before relying on live marks.
market.yahoo_symbols = "NVDA=1"
# Credential-free public crypto feed used to verify the complete live-data,
# chart, risk-preview, and paper-broker path even when Yahoo is unavailable.
market.binance_base_url = "https://api.binance.com"
market.binance_symbols = "BTCUSDT=2"
market.binance_poll_ms = 5000
market.binance_price_scale = 100
news.newsapi_poll_ms = 30000
news.newsapi_base_url = "https://newsapi.org"
news.newsapi_endpoint = "everything"
# For top-headlines, set at least one bounded filter (CFG values override env):
# news.newsapi_country = "us"
# news.newsapi_category = "business"
# news.newsapi_sources = "reuters,associated-press"
# Optional provider queries; when omitted, --symbol or deployment environment is used.
# news.newsapi_query = "AAPL"
# news.yahoo_query = "AAPL"
news.yahoo_poll_ms = 60000
news.http_timeout_ms = 30000
news.max_retries = 4
news.retry_base_ms = 1000
news.retry_max_ms = 60000
reconciliation.poll_ms = 30000
terminal.status_poll_ms = 1000
terminal.alert_poll_ms = 1000
terminal.news_stale_after_ms = 300000
terminal.analyst_stale_after_ms = 300000
alerts.webhook_timeout_ms = 2000
alerts.webhook_poll_ms = 2000
alerts.cooldown_ms = 60000
alerts.max_pending = 4096
# alerts.webhook_url = "https://ops.example/insidertrader-alerts"
supervisor.max_failures = 3
supervisor.window_ns = 60000000000
supervisor.initial_backoff_ns = 100000000
supervisor.max_backoff_ns = 30000000000
supervisor.jitter_bps = 1000
# Python worker isolation and package roots.
python.enabled = false
python.executable = "python3"
python.workdir = "data/python-workers"
python.cpu_seconds = 3600
python.memory_bytes = 536870912
# Python workers cannot access the network unless explicitly enabled.
# python.allow_network = false
python.metrics_root = "metrics"
python.strategies_root = "strategies"
llm.base_url = "https://api.openai.com/v1"
llm.model = "configured-model"
llm.prompt_version = "ai-analyst.v1"
llm.timeout_ms = 30000
# LLM control-plane preferences. The prompt is operator-editable, bounded, and
# never contains provider credentials. Trading actions still pass risk/execution.
llm.system_prompt = "You are the InsiderTrader decision assistant. Explain evidence, uncertainty, and risk before proposing action."
autonomy.mode = "MANUAL"
terminal.theme = "AMBER"
# Deterministic news ordering: RELEVANCE, RECENCY, or SOURCE.
news.sort = "RELEVANCE"

# Optional webhook endpoint may be configured as alerts.webhook_url above or
# supplied through IT_ALERT_WEBHOOK_URL; its timeout and poll cadence are configured above.

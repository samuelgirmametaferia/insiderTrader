[project]
name = "insidertrader"
version = "0.1.0"
description = "Research and Python worker SDKs for InsiderTrader"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/insidertrader"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["python", "tests/python"]


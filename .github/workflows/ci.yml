name: insidertrader-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: insidertrader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: reproducible verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          cache: true

      - name: Install pinned Python runtime
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install schema prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler libssl-dev

      - name: Verify pinned toolchain
        run: make doctor

      - name: Verify all repository gates
        id: gate
        env:
          IT_RUSTUP_TOOLCHAIN: stable
        run: |
          set -o pipefail
          ./scripts/check.sh 2>&1 | tee gate.log

      - name: Upload repository gate log
        if: always() && steps.gate.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: insidertrader-gate-log
          path: gate.log
          if-no-files-found: ignore

      - name: Preflight paper composition root
        run: make paper-check

      - name: Compile native terminal target
        run: cargo check --locked -p insider-terminal

      - name: Audit Rust dependencies
        run: |
          # 0.22.2 understands current RustSec advisories, including CVSS 4.0.
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings

      - name: Verify clean generated/schema state
        run: git diff --exit-code -- schemas Cargo.lock
